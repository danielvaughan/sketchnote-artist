<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sketchnote Artist</title>
  <link rel="stylesheet" href="style.css?v=3">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,700;1,9..144,400&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✍️</text></svg>">
</head>

<body>

  <main class="centered-layout">
    <header class="minimal-header">
      <div class="logo-container">
        <span class="material-icons logo-icon" aria-hidden="true">draw</span>
        <h1 class="logo-text">Sketchnote Artist</h1>
      </div>
      <p class="tagline">Turn any YouTube video into a hand-drawn visual summary</p>
    </header>

    <div class="input-section">
      <div class="search-box">
        <input type="text" id="youtubeUrl" placeholder="Paste any YouTube video URL..." autocomplete="off" autofocus aria-label="YouTube video URL">
        <button id="clearBtn" class="clear-btn hidden" title="Clear" aria-label="Clear URL" onclick="resetUI()">
          <span class="material-icons" aria-hidden="true">close</span>
        </button>
        <button id="generateBtn" class="search-btn" title="Create Sketchnote" aria-label="Create sketchnote" onclick="generateSketchnote()">
          <span class="material-icons" aria-hidden="true">arrow_forward</span>
        </button>
      </div>
      <p id="statusMessage" class="status-text">Paste a URL and press Enter ↵</p>
    </div>

    <div id="displayStage" class="display-stage hidden">
      <!-- Left Pane: Video Player -->
      <div id="videoPlayerContainer" class="video-player-container hidden">
        <iframe id="youtubeEmbed" width="100%" height="100%" src="" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen referrerpolicy="origin" tabindex="-1"></iframe>
      </div>

      <!-- Right Pane: Sketchnote Result -->
      <div id="playerContainer" class="player-container">

        <!-- State: Progress -->
        <div id="progressSection" class="player-state hidden" role="status" aria-live="polite">
          <div class="loading-animation">
            <div class="spinner"></div>
            <p class="loading-text">Watching video...</p>
            <p class="loading-hint">This usually takes 30–60 seconds</p>
          </div>
        </div>

        <!-- State: Result -->
        <div id="resultSection" class="player-state hidden">
          <img id="resultImage" src="" alt="Generated Sketchnote">
          <div class="result-actions">
            <button class="action-btn" onclick="downloadImage()" title="Download" aria-label="Download sketchnote">
              <span class="material-icons" aria-hidden="true">download</span>
            </button>
            <button class="action-btn" onclick="shareImage()" title="Share Link" aria-label="Copy share link">
              <span class="material-icons" aria-hidden="true">share</span>
            </button>
          </div>
        </div>

        <!-- State: Idle -->
        <div id="idleState" class="player-state placeholder">
          <span class="material-icons large-icon" aria-hidden="true">smart_display</span>
        </div>

      </div>
    </div>

    <footer class="minimal-footer">
      <p id="appVersion" class="version-text" aria-label="Application version">v...</p>
    </footer>
  </main>

  <script src="app.js?v=2"></script>
</body>

</html>
